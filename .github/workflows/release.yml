name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Publish (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained single file
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish -c Release -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -p:Version="$VERSION" \
            -o publish/${{ matrix.rid }}

      # Compress-Archive would drop the unix executable bit, so zip on Windows only
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "ScriptAppDashboard-${{ github.ref_name }}-${{ matrix.rid }}.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd publish/${{ matrix.rid }}
          zip -r "../../ScriptAppDashboard-${{ github.ref_name }}-${{ matrix.rid }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: ScriptAppDashboard-${{ matrix.rid }}
          path: ScriptAppDashboard-*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
